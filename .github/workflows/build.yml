name: build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.example.com' }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://app.example.com' }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
